<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Crush Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <div class="logo">🛠️</div>
    <h1>Admin</h1>
    <p class="sub">Control voting and the big reveal.</p>
  </header>

  <section class="card" id="login">
    <label for="key">Admin key <span class="hint">(printed in the server console)</span></label>
    <input id="key" type="password">
    <button id="enter">Enter</button>
    <p class="msg err" id="login-msg"></p>
  </section>

  <section class="card" id="panel" hidden>
    <p id="status"></p>
    <div class="actions">
      <button data-a="close">🔒 Close voting</button>
      <button data-a="open" class="secondary">🔓 Reopen voting</button>
      <button data-a="reveal">🎉 Reveal leaderboard</button>
      <button data-a="hide" class="secondary">🙈 Hide leaderboard</button>
    </div>
    <button data-a="reset" class="secondary" style="margin-top:10px">🗑️ Reset everything</button>
  </section>

  <section class="card" id="results" hidden>
    <h2>🏆 Full results (admin only)</h2>
    <div id="board"></div>
  </section></main>
<script>
const $ = (s) => document.querySelector(s);
let key = sessionStorage.getItem('crush-admin') || '';

async function call(action) {
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, action }),
  });
  const data = await res.json();
  if (!res.ok) { $('#login-msg').textContent = data.error; $('#login').hidden = false; return; }
  sessionStorage.setItem('crush-admin', key);
  $('#login').hidden = true;
  $('#panel').hidden = false;
  $('#results').hidden = false;
  $('#status').innerHTML = `Voting: <strong>${data.open ? 'OPEN' : 'CLOSED'}</strong> · Leaderboard: <strong>${data.revealed ? 'PUBLIC' : 'HIDDEN'}</strong> · Voters: <strong>${data.voterCount}</strong>`;
  const medal = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const top = data.leaderboard[0]?.count || 1;
  $('#board').innerHTML = data.leaderboard.length ? data.leaderboard.map((e) => `
    <div class="row ${e.rank === 1 ? 'winner' : ''}">
      <span class="rank">${medal[e.rank] || '#' + e.rank}</span>
      <span class="name">${esc(e.name)}</span>
      <span class="bar"><i style="width:${(e.count / top) * 100}%"></i></span>
      <span class="count">${e.count} 💘</span>
    </div>`).join('') : '<p class="empty">No votes yet.</p>';}

$('#enter').onclick = () => { key = $('#key').value.trim(); call('status'); };
$('#key').onkeydown = (e) => { if (e.key === 'Enter') $('#enter').click(); };
document.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => {
  if (b.dataset.a === 'reset' && !confirm('Delete ALL votes? This cannot be undone.')) return;
  call(b.dataset.a);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

if (key) call('status');
</script>
</body>
</html>
